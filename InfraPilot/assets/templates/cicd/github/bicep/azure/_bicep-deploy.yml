name: "Bicep Deploy (callable)"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (dev, test, prod)"
      location:
        required: true
        type: string
        description: "Azure region for subscription-scoped deployment"
      parameters_file:
        required: true
        type: string
        description: "Bicep parameters file for this environment (e.g. main.dev.bicepparam)"
    secrets:
      AZURE_CLIENT_ID:
        required: true
      AZURE_TENANT_ID:
        required: true
      AZURE_SUBSCRIPTION_ID:
        required: true

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-and-whatif:
    name: "Validate & What-If"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/bicep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep Build & Lint
        run: az bicep build --file main.bicep

      - name: Deployment What-If
        id: whatif
        run: |
          WHATIF=$(az deployment sub what-if \
            --location ${{ inputs.location }} \
            --template-file main.bicep \
            --parameters ${{ inputs.parameters_file }} \
            --no-pretty-print 2>&1 || true)
          {
            echo "whatif<<EOF"
            echo "$WHATIF"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post What-If to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const whatif = `${{ steps.whatif.outputs.whatif }}`;
            const maxLength = 65000;
            const truncated = whatif.length > maxLength ? whatif.substring(0, maxLength) + '\n\n... (truncated)' : whatif;
            const body = `## Bicep What-If for \`${{ inputs.environment }}\`
            \n<details><summary>Show What-If</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>\n`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  deploy:
    name: "Deploy to ${{ inputs.environment }}"
    needs: validate-and-whatif
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: ./infrastructure/bicep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deployment Create
        id: deploy
        if: |
          github.event_name != 'pull_request' ||
          (github.event_name == 'pull_request' && inputs.environment == 'dev')
        run: |
          az deployment sub create \
            --location ${{ inputs.location }} \
            --template-file main.bicep \
            --parameters ${{ inputs.parameters_file }}
