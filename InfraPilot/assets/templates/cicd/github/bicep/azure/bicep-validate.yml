name: "Bicep Validate & Lint"

on:
  pull_request:
    branches:
      - main
    paths:
      - "infrastructure/bicep/**"
      - ".github/workflows/bicep-validate.yml"

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    name: "Validate & Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/bicep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep Build & Lint
        run: az bicep build --file infrastructure/bicep/main.bicep
        working-directory: .

      - name: Security Scan (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infrastructure/bicep
          framework: bicep
          quiet: true
          soft_fail: false

      - name: Check for TODOs
        run: |
          echo "Checking for TODO comments in Bicep files..."
          if grep -rni "TODO" *.bicep; then
            echo "::warning::Found TODO comments in Bicep files. Remove before merging."
          fi
        continue-on-error: true
