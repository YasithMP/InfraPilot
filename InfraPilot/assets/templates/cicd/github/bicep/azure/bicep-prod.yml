name: "Bicep - Production Environment"

on:
  workflow_dispatch:
    inputs:
      apply_after_whatif:
        description: "Auto-apply after what-if (requires approval)"
        required: true
        default: false
        type: boolean

jobs:
  bicep:
    uses: ./.github/workflows/_bicep-deploy.yml
    with:
      environment: prod
      location: eastus
      parameters_file: main.prod.bicepparam
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
