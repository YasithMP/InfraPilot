name: "Pulumi Deploy (callable)"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: "Target environment (dev, test, prod)"
      stack:
        required: true
        type: string
        description: "Pulumi stack name (dev, test, prod)"
    secrets:
      PULUMI_ACCESS_TOKEN:
        required: true
      # Wire cloud provider credentials as needed for your provider, e.g.
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (AWS),
      # AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID (Azure),
      # GOOGLE_CREDENTIALS (GCP). Declare them here and forward from callers.

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  validate-and-preview:
    name: "Validate & Preview"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure/pulumi
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      # Forward cloud provider creds to the Pulumi runtime as needed, e.g.
      # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      # ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infrastructure/pulumi/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      - name: Pulumi Preview
        uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: ${{ inputs.stack }}
          work-dir: infrastructure/pulumi
          comment-on-pr: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: "Deploy to ${{ inputs.environment }}"
    needs: validate-and-preview
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: ./infrastructure/pulumi
    env:
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      # Forward the same cloud provider creds here as in validate-and-preview, e.g.
      # AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      # AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      # ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      # ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infrastructure/pulumi/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Pulumi Up
        id: deploy
        if: |
          github.event_name != 'pull_request' ||
          (github.event_name == 'pull_request' && inputs.environment == 'dev')
        uses: pulumi/actions@v5
        with:
          command: up
          stack-name: ${{ inputs.stack }}
          work-dir: infrastructure/pulumi
